<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Kopi Apik</title>
<style>
:root{--bg:#fbf3e8;--card:#fffaf2;--ink:#1c1a18;--mute:#7a6a5c;--or:#e8731a;--ol:#4a4a1e;--br:#5a2e1d;--line:#ecdcc6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--card:#221c17;--ink:#f6ebdc;--mute:#b6a591;--line:#3a2f26;--or:#f08a34;--ol:#8b8b45;--br:#b8734f}}
:root[data-theme="dark"]{--bg:#171310;--card:#221c17;--ink:#f6ebdc;--mute:#b6a591;--line:#3a2f26;--or:#f08a34;--ol:#8b8b45;--br:#b8734f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#1c1a18;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:0 0 28px 28px}
.logo{font-family:Georgia,serif;font-weight:900;font-size:34px;color:#e8731a;line-height:1}
.brand b{display:block;font-size:20px;letter-spacing:.5px}
.brand small{color:#d9c7b0;letter-spacing:2px;font-size:11px}
nav{margin-left:auto;display:flex;gap:8px}
nav button{background:transparent;border:1.5px solid #e8731a;color:#fff;padding:8px 16px;border-radius:99px;font-weight:700;cursor:pointer}
nav button.on{background:#e8731a}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:0;border-radius:99px;padding:8px 18px;font-weight:800;color:#fff;cursor:pointer;opacity:.55;font-size:13px;letter-spacing:.5px}
.tab.on{opacity:1}
.tab[data-c="Coffee"]{background:var(--or)}.tab[data-c="Non Coffee"]{background:var(--ol)}.tab[data-c="Tea"]{background:var(--br)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px;min-height:84px}
.item:active{transform:scale(.97)}
.item span{font-weight:700;font-size:14px}.item em{font-style:normal;color:var(--or);font-weight:800}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px}
h2{font-family:Georgia,serif;margin:0 0 10px;font-size:22px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row .n{flex:1;font-size:14px;font-weight:600}.row small{display:block;color:var(--mute);font-weight:400}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--or);background:transparent;color:var(--or);font-weight:900;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin:12px 0}
.total b{color:var(--or)}
input,select{width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{flex:1;padding:7px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-weight:700;font-size:12px}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--or);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.btn.alt{background:transparent;color:var(--mute);border:1.5px solid var(--line);margin-top:8px;font-size:13px;padding:9px}
.btn.dark{background:#1c1a18}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kembali{font-weight:800;margin-bottom:8px;min-height:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat small{color:var(--mute)}.stat b{display:block;font-size:20px;color:var(--or)}
.warn{background:var(--bg);border:2px solid var(--or);border-radius:14px;padding:12px;margin-top:10px}
.warn .two{display:flex;gap:8px;margin-top:8px}.warn .two .btn{padding:9px}
.empty{color:var(--mute);text-align:center;padding:16px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c1a18;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none}
.exf{display:flex;gap:8px}.exf input{margin:0;flex:1;min-width:0}
.xbtn{border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer;padding:4px 8px}
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div class="brand"><b>kopi apik</b><small>SIP. RELAX. ENJOY.</small></div>
  <nav><button id="n1" class="on">Kasir</button><button id="n2">Rekap Hari Ini</button><button id="n3">Riwayat</button></nav>
</header>
<main>
<section id="v1" class="grid">
  <div>
    <div class="tabs" id="tabs"></div>
    <div class="menu" id="menu"></div>
  </div>
  <div class="panel">
    <h2>Pesanan</h2>
    <div id="cart"></div>
    <div class="total"><span>Total</span><b id="tot">Rp0</b></div>
    <select id="metode"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select>
    <div id="cashbox">
      <input id="bayar" type="number" inputmode="numeric" placeholder="Uang diterima (Rp)">
      <div class="quick" id="quick"></div>
      <div class="kembali" id="kembali"></div>
    </div>
    <button class="btn" id="pay" disabled>Bayar &amp; Simpan</button>
    <button class="btn alt" id="clear">Kosongkan pesanan</button>
  </div>
</section>

<section id="v2" class="hide">
  <div class="panel">
    <h2>Rekap Pendapatan Hari Ini</h2>
    <div class="stats" id="stats"></div>
    <h2 style="font-size:17px">Menu terjual</h2><div id="sold"></div>
    <h2 style="font-size:17px;margin-top:14px">Daftar transaksi</h2><div id="trx"></div>
    <h2 style="font-size:17px;margin-top:14px">Pengeluaran hari ini</h2>
    <div class="exf"><input id="exn" placeholder="Keterangan (mis. beli susu)"><input id="exa" type="number" inputmode="numeric" placeholder="Nominal"><button class="btn" id="exadd" style="width:auto;padding:0 18px">Tambah</button></div>
    <div id="exlist" style="margin-top:8px"></div>
    <button class="btn dark" id="close" style="margin-top:14px">Tutup Kasir Hari Ini</button>
    <div class="warn hide" id="warn">
      <b>Tutup kasir sekarang?</b>
      <div style="font-size:13px;color:var(--mute);margin-top:4px">Pendapatan dikurangi pengeluaran akan diarsipkan, lalu transaksi dan pengeluaran dikosongkan untuk hari berikutnya.<div id="wn" style="font-weight:800;color:var(--ink);margin-top:6px"></div></div>
      <div class="two"><button class="btn" id="yes">Ya, tutup</button><button class="btn alt" id="no" style="margin:0">Batal</button></div>
    </div>
  </div>
</section>
<section id="v3" class="hide">
  <div class="panel"><h2>Riwayat Penutupan</h2><div id="histsum"></div><div id="hist"></div></div>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
const MENU=[
["Kopi Apik (18K)",18000,"Coffee"],["Kopi Apik (20K)",20000,"Coffee"],["Americano",18000,"Coffee"],["Americano Gula Aren",20000,"Coffee"],["Americano Berry",23000,"Coffee"],["Kopi Susu Aren",20000,"Coffee"],["Kopi Susu Pandan",23000,"Coffee"],["Butterscotch",28000,"Coffee"],["Butterscotch Sea Salt",28000,"Coffee"],["Caramel Machiato",28000,"Coffee"],["Vietnam Drip",18000,"Coffee"],["Lungo",23000,"Coffee"],
["Matcha Latte",25000,"Non Coffee"],["Strawberry Matcha",28000,"Non Coffee"],["Chocolate",25000,"Non Coffee"],["Red Velvet",25000,"Non Coffee"],["Es Kenapa Muda",25000,"Non Coffee"],["Air Mineral",5000,"Non Coffee"],
["Teman",8000,"Tea"],["Lemon Tea",15000,"Tea"],["Tea Bean",20000,"Tea"]
].map((m,i)=>({id:i,n:m[0],p:m[1],c:m[2]}));
const $=id=>document.getElementById(id);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
let cat="Coffee",cart={},sales=[],closes=[];
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
sales=load("ka_sales",[]);closes=load("ka_close",[]);let exps=load("ka_exp",[]);
const exTot=()=>exps.reduce((s,e)=>s+e.amt,0);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function tabs(){$("tabs").innerHTML=["Coffee","Non Coffee","Tea"].map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${c}">${c.toUpperCase()}</button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;tabs();menu()})}
function menu(){$("menu").innerHTML=MENU.filter(m=>m.c===cat).map(m=>`<button class="item" data-id="${m.id}"><span>${m.n}</span><em>${rp(m.p)}</em></button>`).join("");
 $("menu").querySelectorAll("button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=(cart[id]||0)+1;draw()})}
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+MENU[id].p*q,0);
function draw(){
 const e=Object.entries(cart);
 $("cart").innerHTML=e.length?e.map(([id,q])=>`<div class="row"><div class="n">${MENU[id].n}<small>${rp(MENU[id].p)} × ${q} = ${rp(MENU[id].p*q)}</small></div><div class="q"><button data-id="${id}" data-d="-1">−</button><b>${q}</b><button data-id="${id}" data-d="1">+</button></div></div>`).join(""):'<div class="empty">Belum ada pesanan. Ketuk menu untuk menambah.</div>';
 $("cart").querySelectorAll(".q button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]+=+b.dataset.d;if(cart[id]<=0)delete cart[id];draw()});
 const t=total();$("tot").textContent=rp(t);
 const cash=$("metode").value==="Tunai";$("cashbox").classList.toggle("hide",!cash);
 const q=[...new Set([t,Math.ceil(t/10000)*10000,Math.ceil(t/50000)*50000,100000])].filter(x=>x>=t&&t>0);
 $("quick").innerHTML=q.map(x=>`<button data-v="${x}">${x===t?"Uang pas":rp(x)}</button>`).join("");
 $("quick").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("bayar").value=b.dataset.v;draw()});
 const paid=+$("bayar").value;let ok=t>0;
 if(cash){if(paid>=t&&t>0){$("kembali").textContent="Kembalian: "+rp(paid-t)}else{$("kembali").textContent=t>0&&paid?"Kurang "+rp(t-paid):"";ok=false}}else $("kembali").textContent="";
 $("pay").disabled=!ok;
}
$("bayar").oninput=draw;$("metode").onchange=draw;
$("clear").onclick=()=>{cart={};$("bayar").value="";draw()};
$("pay").onclick=()=>{
 const t=total(),cash=$("metode").value==="Tunai",paid=cash?+$("bayar").value:t;
 sales.push({time:new Date().toISOString(),m:$("metode").value,total:t,paid,items:Object.entries(cart).map(([id,q])=>({n:MENU[id].n,p:MENU[id].p,q}))});
 save("ka_sales",sales);cart={};$("bayar").value="";draw();toast("Transaksi tersimpan ✓");rekap();
};
function sum(arr){const o={n:arr.length,rev:0,cups:0,by:{},sold:{}};arr.forEach(s=>{o.rev+=s.total;o.by[s.m]=(o.by[s.m]||0)+s.total;s.items.forEach(i=>{o.cups+=i.q;o.sold[i.n]=(o.sold[i.n]||0)+i.q})});return o}
const jam=iso=>new Date(iso).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
function expList(){
 $("exlist").innerHTML=exps.length?exps.map((e,i)=>`<div class="row"><div class="n">${esc(e.n)}<small>${jam(e.time)}</small></div><b>-${rp(e.amt)}</b><button class="xbtn" data-i="${i}" title="Hapus">✕</button></div>`).join(""):'<div class="empty">Belum ada pengeluaran.</div>';
 $("exlist").querySelectorAll(".xbtn").forEach(b=>b.onclick=()=>{exps.splice(+b.dataset.i,1);save("ka_exp",exps);rekap()});
}
$("exadd").onclick=()=>{const a=Math.round(+$("exa").value);if(!(a>0)){toast("Isi nominal pengeluaran");return}
 exps.push({n:$("exn").value.trim()||"Pengeluaran",amt:a,time:new Date().toISOString()});save("ka_exp",exps);$("exn").value="";$("exa").value="";rekap();toast("Pengeluaran dicatat")};
function rekap(){
 const o=sum(sales),ex=exTot();expList();
 $("stats").innerHTML=`<div class="stat"><small>Total pendapatan</small><b>${rp(o.rev)}</b></div><div class="stat"><small>Pengeluaran</small><b>-${rp(ex)}</b></div><div class="stat"><small>Pendapatan bersih</small><b>${rp(o.rev-ex)}</b></div><div class="stat"><small>Jumlah transaksi</small><b>${o.n}</b></div><div class="stat"><small>Item terjual</small><b>${o.cups}</b></div>`+Object.entries(o.by).map(([m,v])=>`<div class="stat"><small>${m}</small><b>${rp(v)}</b></div>`).join("");
 const s=Object.entries(o.sold).sort((a,b)=>b[1]-a[1]);
 $("sold").innerHTML=s.length?s.map(([n,q])=>`<div class="row"><div class="n">${n}</div><b>${q}</b></div>`).join(""):'<div class="empty">Belum ada penjualan.</div>';
 $("trx").innerHTML=sales.length?[...sales].reverse().map((t,i)=>`<div class="row"><div class="n">#${sales.length-i} · ${jam(t.time)} · ${t.m}<small>${t.items.map(x=>x.q+"× "+x.n).join(", ")}</small></div><b>${rp(t.total)}</b></div>`).join(""):'<div class="empty">Belum ada transaksi.</div>';
 $("close").disabled=!sales.length&&!exps.length;
}
$("close").onclick=()=>{const r=sum(sales).rev,ex=exTot();$("wn").textContent="Pendapatan "+rp(r)+" − pengeluaran "+rp(ex)+" = bersih "+rp(r-ex);$("warn").classList.remove("hide")};
$("no").onclick=()=>$("warn").classList.add("hide");
$("yes").onclick=()=>{const o=sum(sales),ex=exTot();closes.push({date:new Date().toISOString(),n:o.n,rev:o.rev,cups:o.cups,by:o.by,sold:o.sold,trx:sales,exp:exps,ex:ex,net:o.rev-ex});save("ka_close",closes);sales=[];exps=[];save("ka_sales",sales);save("ka_exp",exps);$("warn").classList.add("hide");rekap();toast("Kasir ditutup. Bersih "+rp(o.rev-ex));nav(3)};
let openI=-1;
const tgl=iso=>new Date(iso).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function hist(){
 $("histsum").innerHTML=`<div class="stats"><div class="stat"><small>Hari ditutup</small><b>${closes.length}</b></div><div class="stat"><small>Total bersih semua penutupan</small><b>${rp(closes.reduce((s,c)=>s+(c.net!==undefined?c.net:c.rev),0))}</b></div></div>`;
 $("hist").innerHTML=closes.length?closes.map((c,i)=>i).reverse().map(i=>{const c=closes[i],o=openI===i;
  let d="";
  if(o){d='<div style="padding:8px 0 12px">'+`<div class="row"><div class="n">Pendapatan kotor</div><b>${rp(c.rev)}</b></div><div class="row"><div class="n">Pengeluaran</div><b>-${rp(c.ex||0)}</b></div><div class="row"><div class="n"><b>Pendapatan bersih</b></div><b style="color:var(--or)">${rp(c.net!==undefined?c.net:c.rev)}</b></div>`+Object.entries(c.by||{}).map(([m,v])=>`<div class="row"><div class="n">${m}</div><b>${rp(v)}</b></div>`).join("");
   if(c.sold){d+='<h2 style="font-size:16px;margin-top:12px">Menu terjual</h2>'+Object.entries(c.sold).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="row"><div class="n">${n}</div><b>${q}</b></div>`).join("")}
   if(c.trx&&c.trx.length){d+='<h2 style="font-size:16px;margin-top:12px">Transaksi</h2>'+c.trx.map((t,k)=>`<div class="row"><div class="n">#${k+1} · ${jam(t.time)} · ${t.m}<small>${t.items.map(x=>x.q+"× "+x.n).join(", ")}</small></div><b>${rp(t.total)}</b></div>`).join("")}
   if(c.exp&&c.exp.length){d+='<h2 style="font-size:16px;margin-top:12px">Pengeluaran</h2>'+c.exp.map(e=>`<div class="row"><div class="n">${esc(e.n)}<small>${jam(e.time)}</small></div><b>-${rp(e.amt)}</b></div>`).join("")}
   d+='</div>'}
  return `<div class="row" data-i="${i}" style="cursor:pointer"><div class="n">${tgl(c.date)}<small>${c.n} transaksi · ${c.cups} item · ketuk untuk ${o?"menutup":"lihat detail"}</small></div><b>${rp(c.net!==undefined?c.net:c.rev)}</b></div>`+d}).join(""):'<div class="empty">Belum ada penutupan.</div>';
 $("hist").querySelectorAll("[data-i]").forEach(r=>r.onclick=()=>{const i=+r.dataset.i;openI=openI===i?-1:i;hist()});
}
function nav(v){[1,2,3].forEach(k=>{$("v"+k).classList.toggle("hide",v!==k);$("n"+k).classList.toggle("on",v===k)});if(v===2)rekap();if(v===3)hist()}
$("n1").onclick=()=>nav(1);$("n2").onclick=()=>nav(2);$("n3").onclick=()=>nav(3);
tabs();menu();draw();rekap();
</script>
</body>
</html>
